services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: linkpe
      POSTGRES_PASSWORD: linkpe
      POSTGRES_DB: linkpe
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U linkpe -d linkpe"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    command: sh -c "npx prisma db push --skip-generate && npm start"
    environment:
      DATABASE_URL: postgresql://linkpe:linkpe@postgres:5432/linkpe
      PORT: 3001
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "3001:3001"

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: http://localhost:3001
        NEXT_PUBLIC_ESCROW_ADDRESS: ${NEXT_PUBLIC_ESCROW_ADDRESS:-0x0000000000000000000000000000000000000000}
        NEXT_PUBLIC_USDC_ADDRESS: ${NEXT_PUBLIC_USDC_ADDRESS:-0x0000000000000000000000000000000000000000}
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:3001
      NEXT_PUBLIC_ESCROW_ADDRESS: ${NEXT_PUBLIC_ESCROW_ADDRESS:-}
      NEXT_PUBLIC_USDC_ADDRESS: ${NEXT_PUBLIC_USDC_ADDRESS:-}
    depends_on:
      - backend
    ports:
      - "3000:3000"

volumes:
  postgres-data:
